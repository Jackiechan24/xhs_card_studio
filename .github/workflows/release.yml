name: Publish plugin release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.version || github.ref_name }}
      - name: Check release files
        run: |
          node --check main.js
          node -e 'const { version } = require("./manifest.json"); if (version !== process.env.RELEASE_VERSION) throw new Error("Tag must match manifest version");'
          test -s styles.css
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_VERSION" main.js manifest.json styles.css --verify-tag --title "XHS Cards $RELEASE_VERSION" --notes-file RELEASE_NOTES.md

